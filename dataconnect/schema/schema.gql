type Student @table(key: ["matricula"]) {
  matricula: String!
  nombre: String!
  apellidoPaterno: String!
  apellidoMaterno: String!
  correo: String!
  nivel: String!
  carrera: String!
  grupo: String!
  codigoQr: String!
}

type Teacher @table(key: ["numCredencial"]) {
  numCredencial: String!
  nombre: String!
  apellidoPaterno: String!
  apellidoMaterno: String!
  correo: String!
  codigoQr: String!
}

type Guest @table(key: ["id"]) {
  id: String!
  nombre: String!
  apellidoPaterno: String!
  apellidoMaterno: String!
  correo: String!
  codigoQr: String!
}

type QrCode @table(key: ["idQr"]) {
  idQr: String!
  tipo: String!
  idReferencia: String!
  titular: String!
  fechaEmision: Date!
  activo: Boolean!
}

type AccessLog @table {
  id: UUID! @default(expr: "uuidV4()")
  idReferencia: String!
  nombre: String!
  grupo: String!
  estado: String!
  fechaHora: Timestamp!
}
